services:
  db:
    image: postgres:16-alpine
    container_name: estudio-track-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estudio
      POSTGRES_PASSWORD: estudio
      POSTGRES_DB: estudio_track
    ports:
      - "5432:5432"
    volumes:
      - estudio_track_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudio -d estudio_track"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estudio_track_data:
